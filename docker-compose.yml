# version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pdm
      POSTGRES_USER: pdm_user
      POSTGRES_PASSWORD: pdm_password
    ports:
      - "5432:5432"
    volumes:
      - pdm_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pdm_user -d pdm"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # kafka:
  # image: apache/kafka:4.1.1
  # container_name: kafka
  # ports:
  #   - "9092:9092"
  # environment:
  #   KAFKA_NODE_ID: 1
  #   KAFKA_PROCESS_ROLES: broker,controller
  #   KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
  #   KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
  #   KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  #   KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
  #   KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
  #   KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
  #   KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  backend:
    build: ./backend
    container_name: pdm-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: pdm
      DB_USER: pdm_user
      DB_PASSWORD: pdm_password
      REDIS_HOST: redis
      # KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # CHANGE THIS in production — minimum 32 chars, inject via secrets manager
      PDM_JWT_SECRET: pdm-dev-secret-change-me-must-be-at-least-32-chars-long
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    container_name: pdm-frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pdm_pg_data:
